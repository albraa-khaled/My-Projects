<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CarPool – Fixed Refresh Issue</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.css" />
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/png" href="car.png"/>
</head>
<body>
<header>
  <button id="sidebarToggle" class="sidebar-toggle">
    <span class="hamburger"></span>
  </button>
  <div class="brand">CarPool</div>

  <div id="search-container" class="search-wrapper">
      <div class="search-input-group">
        <input type="text" id="searchBox" placeholder="Search for a location...">
        <button id="searchBtn">Search</button>
      </div>
      <ul id="searchResults"></ul>
    </div>

  <div class="controls">
    <span id="welcomeText"></span>
    <button id="loginBtn">Login</button>
    <button id="signupBtn">Create Account</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="card">
      <h2>Welcome to CarPool</h2>
      <p class="small">Please wait while we load available trips...</p>
      <div class="loader"></div>
    </div>
  </aside>
  <section class="map-area">
    <div id="map"></div>

    <!-- Top-right search -->
    

    
  </section>
</main>

<footer>
  <div>CarPool &copy; 2025 - Ride Sharing Made Easy</div>
</footer>

<!-- Login Modal -->
<div class="modal" id="loginModal">
  <div class="modal-card">
    <h3>Login</h3>
    <input id="loginUser" placeholder="Username"/>
    <input id="loginPass" type="password" placeholder="Password"/>
    <button id="doLogin">Login</button>
    <button class="btn-link" id="toRegister">Create account</button>
    <button class="modal-close" data-target="loginModal">Close</button>
  </div>
</div>

<!-- Register Modal -->
<div class="modal" id="registerModal">
  <div class="modal-card">
    <h3>Create Account</h3>
    <input id="regUser" placeholder="Username"/>
    <input id="regPass" type="password" placeholder="Password"/>
    <select id="regRole">
      <option value="passenger">Passenger</option>
      <option value="driver">Driver</option>
      <option value="admin">Admin</option>
    </select>
    <button id="doRegister">Create</button>
    <button class="btn-link" id="toLogin">Already have account</button>
    <button class="modal-close" data-target="registerModal">Close</button>
  </div>
</div>

<!-- Templates -->
<template id="passengerTemplate">
  <div class="card">
    <h2>Passenger Dashboard</h2>
    <div class="card-section">
      <h4>Search Trips</h4>
      <label>From<input id="searchFrom" placeholder="Start area"></label>
      <label>To<input id="searchTo" placeholder="Destination"></label>
      <label>Passengers<input id="searchPassengers" type="number" min="1" value="1"></label>
      <label>Date<input id="searchDate" type="date"></label>
      <button id="searchTripsBtn">Find Trips</button>
    </div>
    <div class="card-section">
      <h4>Available Trips</h4>
      <div id="tripList"></div>
    </div>
    <div class="card-section">
      <h4>Your Reservations</h4>
      <div id="passengerReservationsList"></div>
    </div>
  </div>
</template>

<template id="driverTemplate">
  <div class="card">
    <h2>Driver Dashboard</h2>
    <div class="card-section">
      <h4>Create Trip</h4>
      <form id="createTripForm" action="api.php?action=create_trip" method="POST">
        <input type="hidden" name="driver" id="createDriver">
        <label>From<input name="from" id="createFrom" placeholder="Start area" required></label>
        <label>To<input name="to" id="createTo" placeholder="Destination" required></label>
        <label>Date & Time<input name="datetime" id="createDateTime" type="datetime-local" required></label>
        <label>Seats<input name="seats" id="createSeats" type="number" min="1" value="4" required></label>
        <label>Price<input name="price" id="createPrice" type="number" min="0" value="0" required></label>
        <label>Car<input name="car" id="createCar" placeholder="Car model"></label>
        <label>Plate<input name="plate" id="createPlate" placeholder="Plate"></label>
        <input type="hidden" name="redirect" value="1">
        <button type="submit">Create Trip</button>
      </form>
    </div>
    <div class="card-section">
      <h4>Your Trips</h4>
      <div id="driverTripList"></div>
    </div>
    <div class="card-section">
      <h4>Reservations</h4>
      <div id="driverReservationsList"></div>
    </div>
  </div>
</template>

<template id="adminTemplate">
  <div class="card">
    <h2>Admin Dashboard</h2>
    
    <!-- Database Operations -->
    <div class="card-section">
      <h4>Database Operations</h4>
      <select id="tableOperation">
        <option value="">Select Operation...</option>
        <option value="createTable">Create New Table</option>
        <option value="deleteTable">Delete Table</option>
        <option value="showTables">Show All Tables</option>
      </select>
      <div id="dbOperationForm" class="operation-form"></div>
    </div>

    <!-- Users Section -->
    <div class="card-section">
      <h4>Users Management</h4>
      <button class="btn" id="addUserBtn">Add New User</button>
      <div id="adminUsers"></div>
    </div>

    <!-- Trips Section -->
    <div class="card-section">
      <h4>Trips Management</h4>
      <button class="btn" id="addTripBtn">Add New Trip</button>
      <div id="adminTrips"></div>
    </div>

    <!-- Reservations Section -->
    <div class="card-section">
      <h4>Reservations Management</h4>
      <div id="adminReservations"></div>
    </div>
  </div>
</template>

<script src="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.umd.js"></script>
<script src="script.js"></script>
</body>
</html>
